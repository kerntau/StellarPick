# StellarPick nginx 反向代理
# 安装位置（Debian/Ubuntu）: /etc/nginx/sites-available/stellarpick.conf
# 安装位置（RHEL 系）:        /etc/nginx/conf.d/stellarpick.conf
#
# 该靶场故意保留漏洞，切勿直接暴露到公网。
# 建议至少启用下面的 IP 白名单，或使用 VPN / nginx auth_basic。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 若服务器上还有 nginx 默认站点，deploy.sh --nginx 会将其重命名为
    # default.disabled-by-stellarpick，避免默认站点抢占 80 端口。
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10m;

    # 访问控制示例（按需取消注释并改成你的网段）:
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    # 基础认证示例:
    # auth_basic "StellarPick Lab";
    # auth_basic_user_file /etc/nginx/.htpasswd-stellarpick;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:@PORT@/healthz;
        access_log off;
    }
}

# HTTPS（推荐）: 使用 certbot 签发证书后，把上面的 server 改为 443 ssl，
# 或让 certbot 自动改写配置:
#   apt-get install -y certbot python3-certbot-nginx
#   certbot --nginx -d lab.example.com
#
# 注意: V08 的 sp_token Cookie 带 Secure 属性。通过普通 HTTP 访问时，
# 浏览器可能丢弃该 Cookie，导致 CSRF 演示不完整；请使用 HTTPS。
